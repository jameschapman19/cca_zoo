repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # mkdocs.yml uses mkdocs-material's custom `!!python/name:...` tags,
        # which PyYAML's safe loader (used by this hook) can't parse.
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
        exclude: ^(docs/logos/|benchmark/)
      - id: trailing-whitespace
        exclude: ^(docs/logos/|benchmark/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^cca_zoo/
        additional_dependencies:
          - numpy>=1.26
          - scipy>=1.11
          - scikit-learn>=1.6
          - tensorly>=0.8
