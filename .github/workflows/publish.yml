name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cca-zoo/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) -- no API token needed.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git tag history; a shallow
          # checkout would fall back to a "0.1.dev..." version rather than
          # the tag this release points at.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Verify built version matches the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          sdist=$(basename dist/*.tar.gz .tar.gz)
          built="${sdist#cca_zoo-}"
          if [ "$built" != "$tag" ]; then
            echo "::error::Built version '$built' does not match release tag '$GITHUB_REF_NAME' (expected '$tag'). Refusing to publish."
            exit 1
          fi
          echo "Built version $built matches release tag $GITHUB_REF_NAME"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
