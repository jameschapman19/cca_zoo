[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cca-zoo"
dynamic = ["version"]
description = "Multiview CCA methods in a scikit-learn style framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "James Chapman", email = "james.chapman.19@ucl.ac.uk" }]
keywords = ["cca", "multiview", "canonical correlation analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "tensorly>=0.8",
]

[project.optional-dependencies]
deep = ["torch>=2.1", "lightning>=2.1"]
probabilistic = ["numpyro>=0.13", "jax>=0.4", "arviz>=0.17"]
tree = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
optuna = ["optuna>=4.0", "optuna-integration>=4.0"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.5", "mypy>=1.8", "ruff>=0.4", "pandas>=2.0", "polars>=1.0", "skops>=0.11", "array-api-strict>=2.0"]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=0.24",
    "cca-zoo[optuna]",
]
all = ["cca-zoo[deep,probabilistic,tree,optuna]"]

[project.urls]
Homepage = "https://github.com/jameschapman19/cca_zoo"
Repository = "https://github.com/jameschapman19/cca_zoo"
Documentation = "https://jameschapman19.github.io/cca_zoo/"
"Bug Tracker" = "https://github.com/jameschapman19/cca_zoo/issues"

[dependency-groups]
dev = ["cca-zoo[dev]"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "cca_zoo/_version.py"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# PEP 20 where a linter can check it: flat (C90, PLR0915), simple (SIM, RET,
# PIE, C4, PERF), errors never pass silently (BLE, S110), no dead code (ERA).
select = [
    "E", "F", "I", "UP", "ANN", "N", "D",
    "C90", "SIM", "RET", "PIE", "C4", "PERF", "BLE", "S110", "ERA",
    "PLR0915", "PLW", "RUF",
]
ignore = [
    "D203", "D212",
    # Scientific naming conventions: uppercase matrices (A, B, W, X, U, V, K, Q, T)
    "N802",  # function names like _build_A, _build_B
    "N803",  # argument names like X, W, A
    "N806",  # variable names like A, B, W, U, V, K, T
    "N812",  # import alias like F for torch.nn.functional
    # Allow Any in complex generic/sklearn-compatible signatures
    "ANN401",
    # __init__ docstrings not required (class docstring covers it)
    "D107",
    # __all__ is grouped by model family, which reads better than sorted
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/__init__.py" = ["D104"]  # test packages don't need docstrings
"tests/deep/test_deep.py" = ["E402"]  # torch imports must follow importorskip
"tests/tree/test_treecca.py" = ["E402"]  # xgboost import must follow importorskip

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
# Matches the Python version the "Typecheck (mypy)" CI job actually runs on
# (a single, non-matrixed job). This must track that job's setup-python
# version: newer numpy releases ship stub files using syntax (e.g. PEP 695
# `type` aliases) that requires mypy's target to be >= the numpy stub's
# minimum Python, regardless of the package's own `requires-python` floor.
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["misc", "untyped-decorator"]

[tool.pytest.ini_options]
addopts = "-n auto --cov=cca_zoo --cov-report=term-missing"
markers = [
    "slow: tests requiring an optional extra (deselect with -m 'not slow')",
]

[tool.coverage.run]
omit = ["cca_zoo/_version.py"]  # written by hatch-vcs at build time

[tool.coverage.report]
# Fallbacks for a missing optional dependency, which CI always installs.
exclude_also = ["^else:$", "except ImportError:"]
