[project]
name = "ieye"
version = "0.0.1"
description = "Identifiable Eckart-Young CCA: EY plus an axis-aligned non-Gaussianity term"
requires-python = ">=3.11"
dependencies = ["cca-zoo", "torch", "numpy", "scipy", "scikit-learn", "matplotlib", "multiviewica"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ieye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
